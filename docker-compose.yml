services:
  upscaler:
    build:
      context: .
    image: local-image-upscaler

    # Published on the host's loopback only. Reach it from another machine with
    # an SSH tunnel, not by widening this binding — LocalOnlyMiddleware rejects
    # requests that arrive with a non-loopback Host header anyway.
    ports:
      - "127.0.0.1:8000:8000"

    # The container's name for the machine it is running on, so a ComfyUI on
    # this host is reachable without declaring it a remote one.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # The image runs unprivileged as 10001:10001. Override both only to match a
    # host user that owns ComfyUI's input directory; the named volumes below are
    # created for 10001 and need a one-time chown when you do. See
    # docs/deployment.md.
    user: ${UPSCALER_UID:-10001}:${UPSCALER_GID:-10001}

    environment:
      # Binds the container's own interface so the published port can reach it.
      UPSCALER_HOST: 0.0.0.0
      UPSCALER_PORT: 8000
      # bf16 where supported, else fp32. Set fp32 to rule out precision effects.
      UPSCALER_CUDA_PRECISION: ${UPSCALER_CUDA_PRECISION:-auto}
      UPSCALER_MAX_UPLOAD_BYTES: ${UPSCALER_MAX_UPLOAD_BYTES:-104857600}
      # Bounds the queue, not the inference: every waiting job has already
      # streamed its upload into the work volume.
      UPSCALER_MAX_QUEUED_JOBS: ${UPSCALER_MAX_QUEUED_JOBS:-8}
      # Safe mode hides installed features that do not fit stable capacity and
      # rechecks free memory immediately before a job is queued.
      UPSCALER_HARDWARE_POLICY: ${UPSCALER_HARDWARE_POLICY:-safe}
      UPSCALER_RAM_RESERVE_MIB: ${UPSCALER_RAM_RESERVE_MIB:-4096}
      UPSCALER_VRAM_RESERVE_MIB: ${UPSCALER_VRAM_RESERVE_MIB:-1536}
      # Optional corrections for hosts whose driver/container does not report
      # capacity correctly. Leave empty for automatic detection.
      UPSCALER_RAM_MIB: ${UPSCALER_RAM_MIB:-}
      UPSCALER_VRAM_MIB: ${UPSCALER_VRAM_MIB:-}
      UPSCALER_GPU_NAME: ${UPSCALER_GPU_NAME:-}
      UPSCALER_MEMORY_KIND: ${UPSCALER_MEMORY_KIND:-}
      # Fetched into the weights volume on first start. Set either to 0 to skip
      # a download you know this host cannot use.
      UPSCALER_FETCH_REALESRGAN: ${UPSCALER_FETCH_REALESRGAN:-1}
      UPSCALER_FETCH_SWINIR: ${UPSCALER_FETCH_SWINIR:-1}
      # Illustration mode. Unset means the engine does not exist and the mode
      # reports itself unavailable; that is the whole opt-in.
      UPSCALER_COMFYUI_URL: ${UPSCALER_COMFYUI_URL:-}
      # Names the mount below only when the host set a directory, so an unset
      # variable leaves the uploaded source in place rather than pointing the
      # adapter at the placeholder.
      UPSCALER_COMFYUI_INPUT_DIR: ${UPSCALER_COMFYUI_INPUT_DIR:+/comfyui-input}

    volumes:
      # Model weights survive image rebuilds.
      - weights:/weights
      # Per-job scratch space. tmpfs would put full-resolution intermediates in
      # RAM, so this stays a normal volume.
      - work:/work
      # ComfyUI has no API for deleting an input, so the adapter removes the
      # source it uploaded. Without UPSCALER_COMFYUI_INPUT_DIR this is an empty
      # placeholder the adapter never looks at.
      - ${UPSCALER_COMFYUI_INPUT_DIR:-./.upscaler/comfyui-input}:/comfyui-input

    restart: unless-stopped
    stop_grace_period: 30s

    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import urllib.request
          urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health", timeout=5).read()
      interval: 30s
      timeout: 10s
      # Generous: the first start downloads weights before the server binds.
      start_period: 180s
      retries: 3

volumes:
  weights:
  work:
