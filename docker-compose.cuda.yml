# Explicit NVIDIA deployment. The default compose file is CPU-safe; this
# overlay is the only supported path that reserves a GPU and installs torch.
services:
  upscaler:
    image: local-image-upscaler:cuda
    build:
      args:
        # Names the Dockerfile's digest-pinned CUDA stage rather than repeating
        # the digest, which would drift from it. See the cuda-runtime stage.
        RUNTIME_IMAGE: cuda-runtime
        UPSCALER_EXTRAS: ${UPSCALER_EXTRAS-swinir}
    environment:
      UPSCALER_FETCH_REALESRGAN: ${UPSCALER_FETCH_REALESRGAN:-1}
      UPSCALER_FETCH_SWINIR: ${UPSCALER_FETCH_SWINIR:-1}

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
