name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      extended:
        description: Run heavyweight container and optional-runtime smoke tests
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: py${{ matrix.python-version }}

      - name: Run backend CI
        run: make ci-local GATES=backend

  frontend:
    name: Frontend (Node.js 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "10.34.5"
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Run frontend CI
        run: make ci-local GATES=frontend

  container-release:
    name: Release container
    runs-on: ubuntu-24.04
    # The one image carries the CUDA base and the torch stack, so this is a
    # heavier build than the former CPU-only one. The layer cache below is what
    # keeps an ordinary pull request from paying the full cost.
    #
    # A fork cannot write that cache, so on a public repository every outside
    # pull request would pay the full uncached CUDA build. Run it on main, on
    # the weekly schedule, and on demand; a pull request opts in with the
    # `container` label, which is what changes to the image or Compose files
    # should carry.
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'container')
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reclaim runner disk space
        # The one image carries the CUDA base and the whole torch CUDA stack,
        # and `uv sync` needs that stack on disk twice at once: unpacked in the
        # cache mount, then copied into /opt/venv, because UV_LINK_MODE is copy
        # and a hard link cannot cross a cache mount. The layer snapshot, the
        # mode=max cache export and the `load: true` below each want their own
        # copy on top of that. A stock runner does not have the room, and the
        # sync dies partway through installing nccl with "No space left on
        # device (os error 28)".
        #
        # Nothing removed here takes part in this build: it is the preinstalled
        # Android, Haskell, .NET and PowerShell toolchains, the CodeQL bundles,
        # and the images that ship in the daemon. The rest of
        # /opt/hostedtoolcache is deliberately left in place — container-smoke.sh
        # runs the runner's own python3 to read the job JSON.
        run: |
          df -h / | tail -1
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h / | tail -1

      - name: Validate both Compose resolutions
        run: make compose-config

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the release image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: local-image-upscaler
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect and exercise the complete image
        run: scripts/container-smoke.sh local-image-upscaler

  runtime-smoke:
    name: Optional NCNN runtime smoke
    if: github.event_name == 'schedule' || inputs.extended == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: runtime-smoke

      - name: Install software Vulkan and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends mesa-vulkan-drivers
          uv sync --extra dev --locked

      - name: Install checksum-pinned NCNN runtime
        run: ./scripts/install-realesrgan-linux.sh

      - name: Run real inference smoke test
        run: |
          uv run python -c 'from upscaler.models.realesrgan_ncnn import RealEsrganNcnnAdapter; assert RealEsrganNcnnAdapter().available'
          uv run pytest backend/tests/test_realesrgan_integration.py -rs
