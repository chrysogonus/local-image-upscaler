version: 2
updates:
  # "uv", not "pip": the dependency state lives in pyproject.toml *and* a
  # committed uv.lock, and CI and the Dockerfile both resolve with
  # `uv sync --locked`. The pip ecosystem does not maintain uv.lock, so it
  # would either open nothing or open a pyproject-only bump that fails the
  # locked sync.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns: ["*"]
    # typescript-eslint refuses to load at all under TypeScript 7: it throws on
    # import rather than degrading, so the lint gate dies while every other
    # frontend gate still passes, which makes the cause easy to misread. Its
    # peer range is >=4.8.4 <6.1.0, so 6.0.x is the ceiling. Without this the
    # weekly group proposes TypeScript 7 again and the same red build returns.
    # Drop it when TS 7 support lands; nothing else here holds TypeScript back.
    # https://github.com/typescript-eslint/typescript-eslint/issues/10940
    ignore:
      - dependency-name: "typescript"
        versions: [">=7"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      container-images:
        patterns: ["*"]
    open-pull-requests-limit: 5
