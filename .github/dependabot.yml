version: 2
updates:
  # "uv", not "pip": the dependency state lives in pyproject.toml *and* a
  # committed uv.lock, and CI and the Dockerfile both resolve with
  # `uv sync --locked`. The pip ecosystem does not maintain uv.lock, so it
  # would either open nothing or open a pyproject-only bump that fails the
  # locked sync.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      container-images:
        patterns: ["*"]
    open-pull-requests-limit: 5
